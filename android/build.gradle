group = "com.example.npu_pose_detection"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.3.10"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.13.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.example.npu_pose_detection"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        // NPU acceleration requires minSdk 31+
        minSdk = 31
        consumerProguardFiles "proguard-rules.pro"

        // NPU only supports arm64-v8a
        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    // Native C library for shared PoseBuffer (FFI bridge)
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    // Required for NPU runtime libraries
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    // Prevent compressing model files (compression breaks ZIP-based .task files)
    aaptOptions {
        noCompress "tflite", "task"
    }

    dependencies {
        // MediaPipe Tasks - Pose Landmarker with GPU/CPU support
        // Note: tasks-vision includes GPU acceleration via delegates
        implementation("com.google.mediapipe:tasks-vision:0.10.33")

        // TensorFlow Lite for Interpreter API (fallback)
        implementation("org.tensorflow:tensorflow-lite:2.17.0")

        // TensorFlow Lite GPU Delegate for non-Snapdragon devices (Exynos, MediaTek, Tensor)
        implementation("org.tensorflow:tensorflow-lite-gpu:2.17.0")

        // Qualcomm QNN TFLite Delegate for NPU/HTP acceleration (Snapdragon only)
        // From QAIRT SDK 2.35.0 - extracted classes.jar (native .so in jniLibs)
        implementation(files("libs/qnn-delegate.jar"))

        // CameraX for frame processing
        implementation("androidx.camera:camera-core:1.5.3")
        implementation("androidx.camera:camera-camera2:1.5.3")
        implementation("androidx.camera:camera-lifecycle:1.5.3")

        // Coroutines
        implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")

        // Testing
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.21.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
